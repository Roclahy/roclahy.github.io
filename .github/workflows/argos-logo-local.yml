name: "One-time ARGOS logo optimization"

on:
  push:
    branches:
      - roclahy-me-production
    paths:
      - .github/workflows/argos-logo-local.yml

permissions:
  contents: write

jobs:
  optimize-argos-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout production portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image converter
        run: python3 -m pip install --quiet Pillow
      - name: Fetch and optimize official ARGOS avatar
        shell: bash
        run: |
          python3 - <<'PY'
          import io
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          from PIL import Image, ImageOps

          original = "https://t.me/i/userpic/320/ArgosSecurity_bot.jpg"
          def fetch(url):
              with urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; roclahy.me logo optimizer)"}), timeout=20) as response:
                  return response.read(2_000_001)

          urls = [original]
          try:
              class OGImage(HTMLParser):
                  image_url = None
                  def handle_starttag(self, tag, attrs):
                      d = dict(attrs)
                      if tag == "meta" and d.get("property") == "og:image":
                          self.image_url = d.get("content")
              parser = OGImage()
              parser.feed(fetch("https://t.me/ArgosSecurity_bot").decode("utf-8", "replace"))
              if parser.image_url and parser.image_url.startswith("https://"):
                  urls.append(parser.image_url)
          except Exception as exc:
              print("Telegram preview unavailable:", exc)

          image = None
          for url in urls:
              try:
                  data = fetch(url)
                  if len(data) > 2_000_000:
                      raise ValueError("Image too large")
                  candidate = Image.open(io.BytesIO(data))
                  candidate.load()
                  if min(candidate.size) < 100 or max(candidate.size) > 3000:
                      raise ValueError("Unexpected avatar dimensions")
                  image = ImageOps.exif_transpose(candidate).convert("RGB")
                  print("Official image loaded:", candidate.size, candidate.format, "bytes:", len(data))
                  break
              except Exception as exc:
                  print("Failed image candidate:", url, exc)
          if image is None:
              raise RuntimeError("Could not obtain the official ARGOS avatar; no changes will be published")

          image.thumbnail((160, 160), Image.Resampling.LANCZOS)
          dst = Path("assets/argos-logo.webp")
          dst.parent.mkdir(exist_ok=True)
          image.save(dst, "WEBP", quality=84, method=6)
          with Image.open(dst) as check:
              check.verify()
          print("Local optimized avatar:", dst, dst.stat().st_size, "bytes")

          html = Path("index.html")
          source = html.read_text(encoding="utf-8")
          old = '<img src="https://t.me/i/userpic/320/ArgosSecurity_bot.jpg" alt="Logo de ARGOS Security" width="50" height="50" loading="lazy" decoding="async">'
          new = '<img src="assets/argos-logo.webp" alt="Logo de ARGOS Security" width="50" height="50" loading="eager" decoding="async">'
          if source.count(old) != 1:
              raise RuntimeError("Expected exactly one ARGOS avatar in index.html; aborting")
          html.write_text(source.replace(old, new, 1), encoding="utf-8")
          assert html.read_text(encoding="utf-8").count('src="assets/argos-logo.webp"') == 1
          PY
      - name: Publish the image and code together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/argos-logo-local.yml
          git add index.html assets/argos-logo.webp
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf(portfolio): host optimized ARGOS avatar locally"
          git push origin HEAD:roclahy-me-production
